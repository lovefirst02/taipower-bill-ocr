[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "taipower-bill-ocr"
version = "0.1.0"
description = "Offline Taiwan Power bill extraction with PaddleOCR and Windows.Media.Ocr"
requires-python = ">=3.10,<3.14"
dependencies = [
  "Pillow>=10",
  "pdfplumber>=0.11.10",
  "winrt-runtime>=3.2",
  # Runtime dependencies of the projections below; not declared by them.
  "winrt-Windows.Foundation>=3.2",
  "winrt-Windows.Foundation.Collections>=3.2",
  "winrt-Windows.Storage.Streams>=3.2",
  "winrt-Windows.Globalization>=3.2",
  "winrt-Windows.Graphics.Imaging>=3.2",
  "winrt-Windows.Media.Ocr>=3.2",
  "winrt-Windows.Storage>=3.2",
]

[project.optional-dependencies]
paddleocr = ["paddleocr>=3.5,<4", "paddlepaddle==3.2.0"]
mistralocr = ["mistralai==2.9.4"]
excel = ["openpyxl>=3.1"]
# Everything the desktop app needs: uv sync --extra app
app = ["taipower-bill-ocr[excel,paddleocr]"]

[project.scripts]
taipower-bill-watch = "taipower_bill_ocr.watcher:main"

[project.gui-scripts]
taipower-bill-gui = "taipower_bill_ocr.gui:main"

[dependency-groups]
build = ["pyinstaller>=6.10"]

[tool.setuptools.packages.find]
where = ["src"]
